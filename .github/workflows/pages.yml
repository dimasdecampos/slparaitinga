# Publica o site no GitHub Pages a cada push na main, e a cada hora para levar ao site
# o que foi editado no painel /admin (as páginas das festas são geradas a partir do banco).
# portal/ vira a raiz do site e cidade3d/ fica em /cidade3d.
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'   # todo hora, no minuto 7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar páginas
        run: node portal/build-site.mjs
      - name: Montar a pasta do site
        run: |
          mkdir -p _site
          cp -r portal/. _site/
          rm -f _site/*.mjs
          cp -r cidade3d _site/cidade3d
          rm -f _site/cidade3d/*.mjs
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
